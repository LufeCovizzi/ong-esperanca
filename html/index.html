<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ONG Esperança: projetos sociais, voluntariado, doações e cadastro de voluntários.">
  <title>ONG Esperança</title>
  <link rel="icon" href="../imagens/logo.png" type="image/png">
  <!-- Aplica o tema salvo ANTES de desenhar a página (evita piscar no tema errado) -->
  <script>
    try {
      const tema = JSON.parse(localStorage.getItem('ongEsperanca:tema'));
      if (tema && tema !== 'sistema') document.documentElement.dataset.tema = tema;
    } catch (erro) { /* sem localStorage: segue o tema do sistema */ }
  </script>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/main.js"></script>
</head>
<body>
  <a href="#app" class="pular-conteudo">Pular para o conteúdo</a>
  <header>
    <a href="#/inicio" class="marca">
      <picture>
        <source srcset="../imagens/logo.webp" type="image/webp">
        <img src="../imagens/logo.png" alt="Logotipo da ONG Esperança" width="50" height="50">
      </picture>
      <span>ONG Esperança</span>
    </a>
    <div class="seletor-tema">
      <label for="tema">Tema</label>
      <select id="tema">
        <option value="sistema">Automático</option>
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
        <option value="contraste">Alto contraste</option>
      </select>
    </div>
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-icone">
      <span class="sr-only">Abrir menu</span>
      <span class="barras" aria-hidden="true"></span>
    </label>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="#/inicio" data-rota="inicio">Início</a></li>
        <li class="tem-submenu">
          <a href="#/projetos" data-rota="projetos">Projetos</a>
          <ul class="submenu">
            <li><a href="#/projetos/voluntariado">Voluntariado</a></li>
            <li><a href="#/projetos/doacoes">Campanhas de doação</a></li>
            <li><a href="#/projetos/contribuir">Como contribuir</a></li>
          </ul>
        </li>
        <li><a href="#/cadastro" data-rota="cadastro">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contêiner principal da SPA: o router.js limpa e injeta aqui o fragmento de cada rota -->
  <main id="app" class="grade" tabindex="-1" aria-live="polite">
    <p class="destaque-total">Carregando...</p>
  </main>

  <!-- Toast global: controlado pelo módulo toast.js -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <p class="toast__mensagem"></p>
    <button type="button" class="toast__fechar" aria-label="Fechar notificação">&times;</button>
  </div>

  <footer>
    <p>&copy; 2026 ONG Esperança. Todos os direitos reservados. <a href="#/componentes">Guia de componentes</a></p>
  </footer>
</body>
</html>
